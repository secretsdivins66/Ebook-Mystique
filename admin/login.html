<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion administrateur — Arcanes Mystiques</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="auth-screen">
    <div class="auth-card reveal">
      <div class="nav-logo">Arcanes Mystiques</div>
      <h1>Administration</h1>
      <p class="auth-sub">Connecte-toi pour gérer la boutique</p>

      <div class="auth-error" id="auth-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="username" placeholder="admin@livremystique.com">
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;justify-content:center;margin-top:0.6rem">
          Se connecter
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="admin.js"></script>
  <script>
    (async () => {
      // Déjà connecté ? File direct au tableau de bord.
      if (window.sb) {
        const { data } = await window.sb.auth.getSession();
        if (data.session) {
          window.location.href = 'index.html';
          return;
        }
      }
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    })();

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('auth-error');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorBox.classList.remove('show');

      if (!window.sb) {
        errorBox.textContent = 'Connexion au service indisponible. Réessayez dans quelques instants.';
        errorBox.classList.add('show');
        return;
      }

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = 'Connexion...';

      const { error } = await window.sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.textContent = 'Email ou mot de passe incorrect.';
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
